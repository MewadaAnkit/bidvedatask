services:
  postgres:
    image: postgres:16-alpine
    container_name: rfq_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rfq_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rfq_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfq_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/rfq_portal?schema=public"
      JWT_SECRET: "rfq-portal-production-jwt-secret-bidveda-eval"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost:5173,http://localhost"
      UPLOAD_DIR: "./uploads"
      MAX_FILE_SIZE_BYTES: 10485760
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rfq_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
